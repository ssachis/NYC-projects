name: Last Commit intro (temporary)
on:
  push:
    branches: [lc-intro]
    paths: ['lc/*.js', 'lc/*.py', 'lc/lines.json', '.github/workflows/lc-intro.yml']
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: mkdir -p lc/out && node lc/record.js 2>&1 | tee lc/out/record-log.txt
      - run: python lc/build.py
      - if: hashFiles('lc/out/v06.wav') == ''
        run: pip install -q kokoro-onnx soundfile && curl -sSLO https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx && curl -sSLO https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - if: hashFiles('lc/out/v06.wav') == ''
        run: python lc/voice.py | tee lc/out/voice-log.txt
      - name: Save
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lc/out && git commit -m "Last Commit intro: recording and voice" && git push
